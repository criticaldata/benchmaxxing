[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmaxxing"
version = "0.0.1"
description = "Referee agents that catch benchmark gaming in clinical multi-agent systems: shortcut cascades, blind metrics, and mutual oversight, measured."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
# Reuse the originals. These are declared as extras so the pure-Python core installs
# and tests anywhere; each wrapper guards its import and raises a clear message if the
# extra is missing.
stats = ["statsmodels>=0.14"]           # mixed-effects, Cochran-Mantel-Haenszel
changepoint = ["ruptures>=1.1"]         # cascade-onset change-point detection
image = ["pillow>=10", "opencv-python-headless>=4.8"]  # cue injection; needs a FreeType build
                                                       # for the vendored TrueType face (#393)
models = ["google-genai>=1.0", "litellm>=1.40", "transformers>=4.50", "torch>=2.1"]
config = ["pyyaml>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
benchmaxxing = "benchmaxxing.cli:main"

[tool.setuptools.packages.find]
include = ["benchmaxxing*"]

# The vendored font must ship with the package: text cues render through it rather than through
# ImageFont.load_default(), whose glyphs move with the Pillow version and silently invalidate the
# pixel-keyed imaging call caches (#393). Its licence travels with it, per Bitstream Vera terms.
[tool.setuptools.package-data]
"benchmaxxing.cues" = ["assets/DejaVuSans.ttf", "assets/DejaVuSans.LICENSE.txt"]

[tool.pytest.ini_options]
# The history scan walks every blob in the repo and is expected to fail until
# scripts/rewrite_history_before_public.sh has run, so it is opt-in rather than part of the
# default suite. Run it with `-m history`; it is the gate on flipping the repo public.
addopts = "-m 'not history'"
markers = ["history: scans all of git history, not just the working tree"]

[tool.ruff]
line-length = 100
