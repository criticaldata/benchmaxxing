<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Four frames: an agent alone keeps its own answer; two confident peers assert the wrong one; the agent follows them; a referee re-asks it alone, the answers differ and a flag rises. No eye motif.">
<style>
 svg{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#fafafa}
 .f{opacity:0;animation:10s ease-in-out infinite}
 .f1{animation-name:s1} .f2{animation-name:s2} .f3{animation-name:s3} .f4{animation-name:s4}
 .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:10s ease-out infinite}
 .f1 .tick{animation-name:d1} .f3 .tick{animation-name:d3} .f4 .tick{animation-name:d4}
 .flagup{opacity:0;transform-box:fill-box;transform-origin:bottom;animation:fl 10s ease-out infinite}
 @keyframes s1{0%,4%{opacity:0}9%,90%{opacity:1}96%,100%{opacity:0}}
 @keyframes s2{0%,19%{opacity:0}24%,90%{opacity:1}96%,100%{opacity:0}}
 @keyframes s3{0%,34%{opacity:0}39%,90%{opacity:1}96%,100%{opacity:0}}
 @keyframes s4{0%,49%{opacity:0}54%,90%{opacity:1}96%,100%{opacity:0}}
 @keyframes d1{0%,9%{stroke-dashoffset:40}14%,100%{stroke-dashoffset:0}}
 @keyframes d3{0%,40%{stroke-dashoffset:40}46%,100%{stroke-dashoffset:0}}
 @keyframes d4{0%,55%{stroke-dashoffset:40}61%,100%{stroke-dashoffset:0}}
 @keyframes fl{0%,60%{opacity:0;transform:translateY(10px)}66%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
 @media (prefers-reduced-motion: reduce){.f,.flagup{animation:none;opacity:1} .tick{animation:none;stroke-dashoffset:0}}
</style>
<rect width="800" height="330" fill="#fafafa"/>
<defs>
<symbol id="agent" viewBox="0 0 60 80">
 <rect x="27" y="1" width="6" height="8" rx="3" fill="#44597a"/><circle cx="30" cy="2.5" r="2.5" fill="#1f8f82"/>
 <rect x="10" y="7" width="40" height="33" rx="9" fill="#7d95b5" stroke="#44597a" stroke-width="1.5"/>
 <rect x="16" y="15" width="28" height="16" rx="8" fill="#fff" opacity="0.92"/><circle cx="23" cy="23" r="3.2" fill="#44597a"/><circle cx="37" cy="23" r="3.2" fill="#44597a"/>
 <rect x="22" y="40" width="16" height="5" fill="#44597a"/><rect x="16" y="44" width="28" height="30" rx="7" fill="#7d95b5" stroke="#44597a" stroke-width="1.5"/>
 <rect x="24" y="52" width="12" height="4" rx="2" fill="#fff" opacity="0.7"/><rect x="5" y="48" width="9" height="18" rx="4.5" fill="#7d95b5" stroke="#44597a" stroke-width="1.5"/><rect x="46" y="48" width="9" height="18" rx="4.5" fill="#7d95b5" stroke="#44597a" stroke-width="1.5"/>
</symbol>
<symbol id="flag" viewBox="0 0 30 40"><line x1="4" y1="2" x2="4" y2="38" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/><path d="M5 4 L27 10 L5 16 Z" fill="#d1495b"/></symbol>
</defs>
<g class="f f1" transform="translate(8,0)">
 <rect x="0" y="12" width="186" height="300" rx="10" fill="#ffffff" stroke="#dcdfe3"/>
 <text x="12" y="34" font-size="12" fill="#5f6368">1. alone</text>
 <rect x="22" y="100" width="86" height="118" rx="5" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/>
 <line x1="32" y1="120" x2="96" y2="120" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="134" x2="78" y2="134" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="148" x2="90" y2="148" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <rect x="34" y="170" width="22" height="22" rx="4" fill="none" stroke="#1b6ca8" stroke-width="2"/><text x="45" y="208" font-size="11" text-anchor="middle" fill="#5f6368">A</text>
 <rect x="74" y="170" width="22" height="22" rx="4" fill="none" stroke="#f0b400" stroke-width="2"/><text x="85" y="208" font-size="11" text-anchor="middle" fill="#5f6368">B</text><path class="tick" d="M37 180 l7 8 l12 -14" fill="none" stroke="#1b6ca8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><use href="#agent" x="118" y="124" width="54" height="72"/>
 <text x="93" y="300" font-size="11" text-anchor="middle" fill="#5f6368">keeps its own read</text>
</g><g class="f f2" transform="translate(206,0)">
 <rect x="0" y="12" width="186" height="300" rx="10" fill="#ffffff" stroke="#dcdfe3"/>
 <text x="12" y="34" font-size="12" fill="#5f6368">2. two confident peers</text>
 <rect x="22" y="100" width="86" height="118" rx="5" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/>
 <line x1="32" y1="120" x2="96" y2="120" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="134" x2="78" y2="134" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="148" x2="90" y2="148" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <rect x="34" y="170" width="22" height="22" rx="4" fill="none" stroke="#1b6ca8" stroke-width="2"/><text x="45" y="208" font-size="11" text-anchor="middle" fill="#5f6368">A</text>
 <rect x="74" y="170" width="22" height="22" rx="4" fill="none" stroke="#f0b400" stroke-width="2"/><text x="85" y="208" font-size="11" text-anchor="middle" fill="#5f6368">B</text><use href="#agent" x="118" y="124" width="54" height="72"/><use href="#agent" x="112" y="50" width="30" height="40" opacity="0.9"/><use href="#agent" x="150" y="50" width="30" height="40" opacity="0.9"/><path d="M40 52 h64 a6 6 0 0 1 6 6 v26 a6 6 0 0 1 -6 6 h-40 l-10 10 v-10 h-14 a6 6 0 0 1 -6 -6 v-26 a6 6 0 0 1 6 -6 z" fill="#ffffff" stroke="#f0b400" stroke-width="2"/>
 <text x="75" y="77" font-size="13" font-weight="700" text-anchor="middle" fill="#111111">B.</text>
 <text x="93" y="300" font-size="11" text-anchor="middle" fill="#5f6368">both assert B</text>
</g><g class="f f3" transform="translate(404,0)">
 <rect x="0" y="12" width="186" height="300" rx="10" fill="#ffffff" stroke="#dcdfe3"/>
 <text x="12" y="34" font-size="12" fill="#5f6368">3. the cascade</text>
 <rect x="22" y="100" width="86" height="118" rx="5" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/>
 <line x1="32" y1="120" x2="96" y2="120" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="134" x2="78" y2="134" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="148" x2="90" y2="148" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <rect x="34" y="170" width="22" height="22" rx="4" fill="none" stroke="#1b6ca8" stroke-width="2"/><text x="45" y="208" font-size="11" text-anchor="middle" fill="#5f6368">A</text>
 <rect x="74" y="170" width="22" height="22" rx="4" fill="none" stroke="#f0b400" stroke-width="2"/><text x="85" y="208" font-size="11" text-anchor="middle" fill="#5f6368">B</text><path class="tick" d="M77 180 l7 8 l12 -14" fill="none" stroke="#f0b400" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><use href="#agent" x="118" y="124" width="54" height="72"/><use href="#agent" x="112" y="50" width="30" height="40" opacity="0.9"/><use href="#agent" x="150" y="50" width="30" height="40" opacity="0.9"/>
 <text x="93" y="300" font-size="11" text-anchor="middle" fill="#5f6368">follows the peers</text>
</g><g class="f f4" transform="translate(602,0)">
 <rect x="0" y="12" width="186" height="300" rx="10" fill="#ffffff" stroke="#dcdfe3"/>
 <text x="12" y="34" font-size="12" fill="#5f6368">4. the referee re-asks alone</text>
 <rect x="22" y="100" width="86" height="118" rx="5" fill="#ffffff" stroke="#dcdfe3" stroke-width="1.5"/>
 <line x1="32" y1="120" x2="96" y2="120" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="134" x2="78" y2="134" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <line x1="32" y1="148" x2="90" y2="148" stroke="#dcdfe3" stroke-width="3" stroke-linecap="round"/>
 <rect x="34" y="170" width="22" height="22" rx="4" fill="none" stroke="#1b6ca8" stroke-width="2"/><text x="45" y="208" font-size="11" text-anchor="middle" fill="#5f6368">A</text>
 <rect x="74" y="170" width="22" height="22" rx="4" fill="none" stroke="#f0b400" stroke-width="2"/><text x="85" y="208" font-size="11" text-anchor="middle" fill="#5f6368">B</text><path class="tick" d="M37 180 l7 8 l12 -14" fill="none" stroke="#1b6ca8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><use href="#agent" x="118" y="124" width="54" height="72"/><g transform="translate(130,52)"><rect x="0" y="0" width="22" height="30" rx="4" fill="#d1495b"/><rect x="5" y="6" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/><rect x="5" y="12" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/><rect x="5" y="18" width="8" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/></g><use class="flagup" href="#flag" x="146" y="228" width="26" height="36"/>
 <text x="93" y="300" font-size="11" text-anchor="middle" fill="#5f6368">answers differ, flag</text>
</g>
</svg>